:root{--font:"CFSans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--sw:236px;--teal:#2DD4BF;--coral:#FB7C5C}
html[data-theme=dark]{--bg:#070C18;--card:rgba(255,255,255,.055);--cardb:rgba(255,255,255,.11);--solid:#101A33;--ink:#E6EDF7;--gray:#94A6C2;--line:rgba(255,255,255,.10);--navy:#E6EDF7;--light:rgba(255,255,255,.06);--band:rgba(34,211,238,.11);--inbg:rgba(34,211,238,.08);--inc:#7DD3FC;--grid:rgba(255,255,255,.09);--gridz:rgba(255,255,255,.38);--th:rgba(34,211,238,.14);--thc:#A5F3FC;--acc:#22D3EE;--btn:linear-gradient(135deg,#14B8A6,#22D3EE);--btnc:#04222B;--btnalt:rgba(255,255,255,.12);--btnaltc:#E6EDF7;--warnbtn:linear-gradient(135deg,#F97316,#FB7C5C);--sidebg:rgba(10,18,38,.74);--glow:0 0 0 1px rgba(34,211,238,.40),0 0 26px rgba(34,211,238,.20);--shadow:0 10px 34px rgba(0,0,0,.42);--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--teal:#2DD4BF;--coral:#FB7C5C}
html[data-theme=light]{--bg:#EEF2F6;--card:#fff;--cardb:#E5E7EB;--solid:#fff;--ink:#1F2937;--gray:#6B7280;--line:#E5E7EB;--navy:#1F3A5F;--light:#F4F6F8;--band:#DCE6F0;--inbg:#FFF8E1;--inc:#0000CC;--grid:#E5E7EB;--gridz:#9CA3AF;--th:#1F3A5F;--thc:#fff;--acc:#2A9D8F;--btn:#2A9D8F;--btnc:#fff;--btnalt:#1F3A5F;--btnaltc:#fff;--warnbtn:#E76F51;--sidebg:#fff;--glow:0 0 0 2px rgba(42,157,143,.35);--shadow:0 1px 3px rgba(0,0,0,.06);--ok:#1E7B4F;--warn:#B7791F;--bad:#C0392B;--teal:#2A9D8F;--coral:#E76F51}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
html[data-theme=dark] body{background:radial-gradient(1100px 560px at 88% -8%,rgba(34,211,238,.15),transparent 60%),radial-gradient(900px 520px at -8% 108%,rgba(139,92,246,.17),transparent 60%),var(--bg);background-attachment:fixed}
select option{background:var(--solid);color:var(--ink)}
#shell{display:flex;min-height:100vh}
#side{width:var(--sw);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:18px 12px;background:var(--sidebg);border-right:1px solid var(--cardb);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20;transition:width .2s}
.brandbox{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--btn);color:var(--btnc);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;box-shadow:var(--glow)}
.bname{font-weight:700;font-size:15px;line-height:1.2;color:var(--navy)}
.bname small{display:block;font-weight:400;font-size:11px;color:var(--gray);margin-top:2px}
#nav{display:flex;flex-direction:column;gap:6px}
#nav button{position:relative;display:flex;align-items:center;gap:14px;border:0;background:transparent;color:var(--gray);font:inherit;font-weight:500;font-size:14px;letter-spacing:.4px;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left;transition:.15s}
#nav button svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{background:var(--light);color:var(--ink)}
#nav button.on{background:var(--band);color:var(--navy);font-weight:700}
#nav button.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--c,var(--acc));box-shadow:0 0 14px var(--c,var(--acc))}
#nav button.on svg{color:var(--c,var(--acc))}
.sidefoot{margin-top:auto}
.sidefoot button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--cardb);background:var(--light);color:var(--gray);font:inherit;font-size:13px;padding:10px 14px;border-radius:12px;cursor:pointer}
.sidefoot button:hover{color:var(--ink)}
.sidefoot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#content{margin-left:var(--sw);flex:1;min-width:0;transition:margin .2s}
body.collapsed{--sw:72px}
body.collapsed .bname,body.collapsed #nav button span,body.collapsed .sidefoot span{display:none}
body.collapsed #nav button,body.collapsed .sidefoot button{justify-content:center;padding:12px}
body.collapsed .brandbox{justify-content:center;padding-left:0;padding-right:0}
body.collapsed #collapseBtn svg{transform:rotate(180deg)}
.locked #side{display:none}.locked #content{margin-left:0}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 26px;position:sticky;top:0;z-index:10;background:var(--sidebg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--cardb)}
header h1{font-size:20px;margin:0;font-weight:700;color:var(--navy);letter-spacing:-.3px}
header .sp{flex:1}
header label{font-size:12px;color:var(--gray);margin-right:6px}
header select,header button{font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--cardb);padding:8px 12px;background:var(--card);color:var(--ink);cursor:pointer}
header select{font-weight:700;color:var(--navy)}
header button:hover{border-color:var(--acc);box-shadow:var(--glow)}
#themeBtn{display:grid;place-items:center;width:40px;height:38px;padding:0}
#themeBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#whoami{font-size:13px;color:var(--gray)}
.locked #logout,.locked #whoami{display:none}
main{max-width:1280px;margin:0 auto;padding:22px 26px 56px}
.card,.kpi{background:var(--card);border:1px solid var(--cardb);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{padding:18px;margin-bottom:16px;position:relative}
.kpi:hover,.kpi:focus-within,.card:hover,.card:focus-within{z-index:60}
.card h3{margin:0 0 12px;font-size:15px;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}.row2>.card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 14px 12px;position:relative;overflow:visible}
.kpi::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--kc,var(--acc));box-shadow:0 0 16px var(--kc,var(--acc))}
.kpi small{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;line-height:1.2}
.kpi b{display:block;font-size:21px;color:var(--navy);margin:8px 0 2px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .cap{font-size:12px;color:var(--gray);display:block}
.spark{display:block;width:100%;height:30px;margin-top:8px}
.spark polyline{fill:none;stroke:var(--kc,var(--acc));stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark path{fill:var(--kc,var(--acc));opacity:.14}
.pos{color:var(--ok)!important}.neg{color:var(--bad)!important}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--gray);vertical-align:0}

      const e=b2i(sha256(msgOf(dev))),d=BigInt("0x"+dHex);
      for(;;){const k=b2i(crypto.getRandomValues(new Uint8Array(32)))%n;if(k===0n)continue;
        const r=aff(mul(k,G))[0]%n;if(r===0n)continue;const s=inv(k,n)*((e+r*d)%n)%n;if(s===0n)continue;
        const raw=new Uint8Array(64);const hx=hex32(r)+hex32(s);for(let i=0;i<64;i++)raw[i]=parseInt(hx.substr(i*2,2),16);
        return"CF1-"+group(enc(raw),8)}},
    verify(dev,key,pub){
      try{let s=clean(key);if(!s.startsWith("CF1"))return false;const raw=dec(s.slice(3));if(!raw||raw.length!==64)return false;
        const r=b2i(raw.slice(0,32)),sg=b2i(raw.slice(32));if(r<1n||r>=n||sg<1n||sg>=n)return false;
        const e=b2i(sha256(msgOf(dev))),w=inv(sg,n),R=add(mul(e*w%n,G),mul(r*w%n,[pub.x,pub.y,1n]));
        if(R[2]===0n)return false;return aff(R)[0]%n===r}catch(_){return false}},
    _sha256:sha256,_onCurve:()=>m(Gy*Gy)===m(Gx*Gx*Gx-3n*Gx+0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604bn)
  };
})();

const AUTH_KEY="cf_auth",FAIL_KEY="cf_fail",PW_ITER=15000;
let AUTH=null,LOGGED=false,AUI={view:"login",code:"",err:""};
const cat=(a,b)=>{const o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o};
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
function hmac256(key,msg){const k=new Uint8Array(64);k.set(key.length>64?LIC._sha256(key):key);const ip=k.map(b=>b^0x36),op=k.map(b=>b^0x5c);return LIC._sha256(cat(op,LIC._sha256(cat(ip,msg))))}
function pbkdf2(pass,salt,iter){const P=new TextEncoder().encode(pass);let u=hmac256(P,cat(salt,Uint8Array.of(0,0,0,1)));const t=u.slice();for(let i=1;i<iter;i++){u=hmac256(P,u);for(let j=0;j<32;j++)t[j]^=u[j]}return t}
function mkHash(secret){const salt=crypto.getRandomValues(new Uint8Array(16));return{s:hex(salt),h:hex(pbkdf2(secret,salt,PW_ITER)),i:PW_ITER}}
function chkHash(rec,secret){return !!rec&&hex(pbkdf2(secret,unhex(rec.s),rec.i))===rec.h}
const normUser=u=>String(u||"").trim().toLowerCase();
function newRecCode(){const r=crypto.getRandomValues(new Uint8Array(16));let s="";for(const v of r)s+="0123456789ABCDEFGHJKMNPQRSTVWXYZ"[v&31];return s}
const fmtRec=c=>c.match(/.{4}/g).join("-");
function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH))}catch(e){memoryOnly=true}}
function initAuth(){
  try{AUTH=JSON.parse(localStorage.getItem(AUTH_KEY)||"null")}catch(e){AUTH=null}
  if(AUTH&&!AUTH.u)AUTH=null;
  try{LOGGED=!!AUTH&&sessionStorage.getItem("cf_sess")==="1"}catch(e){LOGGED=false}
}
function failState(){try{return JSON.parse(localStorage.getItem(FAIL_KEY)||"{}")}catch(e){return{}}}
function waitLeft(){const f=failState();return f.until&&f.until>Date.now()?Math.ceil((f.until-Date.now())/1000):0}
function addFail(){const f=failState();f.n=(f.n||0)+1;if(f.n>=5)f.until=Date.now()+30000*Math.min(8,f.n-4);try{localStorage.setItem(FAIL_KEY,JSON.stringify(f))}catch(e){}}
function clearFail(){try{localStorage.removeItem(FAIL_KEY)}catch(e){}}
function aerr(m){AUI.err=m;const e=document.querySelector(".lock .err");if(e)e.textContent=m}
function enterApp(){LOGGED=true;try{sessionStorage.setItem("cf_sess","1")}catch(e){}AUI={view:"login",code:"",err:""};render()}

    <div class="band">NÃO TEM O CÓDIGO?</div><div class="hint">Sem o código, só é possível recomeçar do zero (isso apaga os dados deste programa). Se você tiver um backup, poderá restaurá-lo depois.</div>
    <button class="btn warn" data-act="a_wipe">Apagar tudo e recomeçar</button></div>`}
  else{const w=waitLeft();h=`<h2>Entrar</h2><div class="hint" style="font-size:14px">Digite o seu usuário e a sua senha.</div>

function authClick(t){
  const a=t.dataset.act;if(!a)return;
  if(a==="a_create"){const u=$("#aUser").value.trim(),p=$("#aPw").value,p2=$("#aPw2").value;
    if(u.length<3)return aerr("O usuário precisa ter pelo menos 3 caracteres.");
    if(p.length<6)return aerr("A senha precisa ter pelo menos 6 caracteres.");
    if(p!==p2)return aerr("As senhas não conferem.");
    const code=newRecCode();AUTH={u,pw:mkHash(p),rec:mkHash(code)};saveAuth();AUI={view:"recshow",code,err:""};renderAuth()}
  else if(a==="a_ack"){if(!$("#ack").checked)return aerr("Marque a caixa depois de anotar o código.");enterApp()}
  else if(a==="a_copyrec"){copyText(fmtRec(AUI.code))}
  else if(a==="a_login"){const w=waitLeft();if(w)return aerr("Muitas tentativas. Aguarde "+w+" segundos.");
    if(normUser($("#aUser").value)===normUser(AUTH.u)&&chkHash(AUTH.pw,$("#aPw").value)){clearFail();enterApp()}
    else{addFail();const w2=waitLeft();aerr(w2?"Muitas tentativas. Aguarde "+w2+" segundos.":"Usuário ou senha incorretos.")}}
  else if(a==="a_forgot"){AUI={view:"forgot",code:"",err:""};renderAuth()}
  else if(a==="a_back"){AUI={view:"login",code:"",err:""};renderAuth()}
  else if(a==="a_reset"){const w=waitLeft();if(w)return aerr("Muitas tentativas. Aguarde "+w+" segundos.");
    const code=LIC.clean($("#aRec").value),p=$("#aPw").value,p2=$("#aPw2").value;
    if(p.length<6)return aerr("A nova senha precisa ter pelo menos 6 caracteres.");
    if(p!==p2)return aerr("As senhas não conferem.");
    if(!chkHash(AUTH.rec,code)){addFail();return aerr("Código de recuperação incorreto.")}
    clearFail();const nc=newRecCode();AUTH.pw=mkHash(p);AUTH.rec=mkHash(nc);saveAuth();AUI={view:"recshow",code:nc,err:""};renderAuth()}
  else if(a==="a_wipe"){if(confirm("Isso apaga TODOS os dados e o acesso deste programa. Deseja continuar?")&&confirm("Tem certeza? Esta ação não pode ser desfeita.")){
    DB=freshDB();save();AUTH=null;try{localStorage.removeItem(AUTH_KEY)}catch(e){}clearFail();AUI={view:"login",code:"",err:""};renderAuth()}}
}

/* ---------- cálculos ---------- */
function monthTotals(list){return M.map((_,i)=>sum(list.map(r=>r.v[i])))}
function catOf(item){return DB.cats.includes(item.cat)?item.cat:"Outros"}
function calc(){
  const y=Y(), rec=monthTotals(y.rec), des=monthTotals(y.des);
  const saldo=rec.map((v,i)=>v-des[i]); let a=0; const acum=saldo.map(v=>a+=v);
  const catNames=[...DB.cats,"Outros"];
  const cat=catNames.map(n=>({name:n,v:M.map((_,i)=>sum(y.des.filter(r=>catOf(r)===n).map(r=>r.v[i])))}));
  cat.forEach(c=>c.total=sum(c.v));
  const tipoNames=[...TYPES,"Sem tipo"];
  const tipo=tipoNames.map(n=>({name:n,v:M.map((_,i)=>sum(y.rec.filter(r=>(TYPES.includes(r.type)?r.type:"Sem tipo")===n).map(r=>r.v[i])))}));
  tipo.forEach(c=>c.total=sum(c.v));
  const top=y.des.map(r=>({name:r.name||"(sem nome)",value:sum(r.v)})).filter(x=>x.value>0).sort((p,q)=>q.value-p.value).slice(0,10);
  const R=sum(rec),D=sum(des);
  return {rec,des,saldo,acum,cat,tipo,top,R,D,S:R-D,tx:R?(R-D)/R:0};
}
function hasData(){return Object.values(DB.years).some(y=>y.rec.length||y.des.length)}

/* ---------- gráficos SVG ---------- */
function nice(min,max){
  if(max===min) max=min+1;
  const step0=(max-min)/5, mag=Math.pow(10,Math.floor(Math.log10(step0))), n=step0/mag;
  const step=(n<1.5?1:n<3?2:n<7?5:10)*mag, lo=Math.floor(min/step+1e-9)*step, hi=Math.ceil(max/step-1e-9)*step, ticks=[];
  for(let v=lo;v<=hi+step/1000;v+=step) ticks.push(+v.toFixed(6));
  return {lo,hi,ticks};
}
function frame(W,H,inner,label){return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${inner}</svg>`}
function axes(sc,W,H,l,r,t,b){
  const ph=H-t-b, y=v=>t+ph*(1-(v-sc.lo)/(sc.hi-sc.lo)); let g="";
  sc.ticks.forEach(v=>{g+=`<line class="${v===0?"gz":"gl"}" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" class="ax">${fmtK(v)}</text>`});
  return {g,y};
}
function legendHTML(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join("")}</div>`}
function chartBars(series,label,colorFn){
  const W=640,H=300,l=52,r=10,t=12,b=28,pw=W-l-r;
  const all=series.flatMap(s=>s.vals);
  if(!all.some(v=>v)) return `<div class="empty">Sem dados neste ano ainda.</div>`;
  const sc=nice(Math.min(0,...all),Math.max(0,...all)), {g:grid,y}=axes(sc,W,H,l,r,t,b);
  const gw=pw/12,n=series.length,bw=Math.min(24,(gw*.74)/n); let g=grid;
  M.forEach((m,i)=>{const cx=l+gw*i+gw/2; g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax">${m}</text>`;
    series.forEach((s,j)=>{const v=s.vals[i]; if(!v) return; const x=cx-(n*bw)/2+j*bw, y0=y(0), y1=y(v);
      g+=`<rect class="bv${v<0?" ng":""}" style="animation-delay:${i*45}ms" x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.abs(y1-y0).toFixed(1)}" rx="3" fill="${colorFn?colorFn(v):s.color}"><title>${esc(s.name)} - ${m}: ${money(v)}</title></rect>`})});
  return frame(W,H,g,label)+(colorFn?legendHTML([{name:"Saldo positivo",color:"#2DD4BF"},{name:"Saldo negativo",color:"#FB7C5C"}]):legendHTML(series));
}
function chartLine(vals,label,color){
  const W=640,H=300,l=52,r=14,t=12,b=28,pw=W-l-r;
  if(!vals.some(v=>v)) return `<div class="empty">Sem dados neste ano ainda.</div>`;
  const sc=nice(Math.min(0,...vals),Math.max(0,...vals)), {g:grid,y}=axes(sc,W,H,l,r,t,b);
  const gw=pw/12; let g=grid, pts=[];
  M.forEach((m,i)=>{const cx=l+gw*i+gw/2; g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax">${m}</text>`; pts.push([cx,y(vals[i])])});
  g+=`<polyline class="ln" pathLength="1" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${color})" points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ")}"/>`;
  pts.forEach((p,i)=>g+=`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${color}"><title>${M[i]}: ${money(vals[i])}</title></circle>`);
  return frame(W,H,g,label);
}
function chartDonut(items,label){
  const tot=sum(items.map(i=>i.value));
  if(!tot) return `<div class="empty">Sem despesas neste ano ainda.</div>`;
  const R=70,C=2*Math.PI*R; let off=0, segs="";
  items.forEach((it,k)=>{if(!it.value) return; const f=it.value/tot; segs+=`<circle style="animation-delay:${k*90}ms" r="${R}" cx="110" cy="110" fill="none" stroke="${it.color}" stroke-width="38" stroke-dasharray="${(f*C).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off*C).toFixed(2)}" transform="rotate(-90 110 110)"><title>${esc(it.name)}: ${money(it.value)} (${pct(f)})</title></circle>`; off+=f});
  const svg=frame(220,220,`<g class="dn">${segs}</g><text x="110" y="106" text-anchor="middle" class="ax">Total</text><text x="110" y="126" text-anchor="middle" class="dtx" style="font-size:15px;font-weight:700">${fmtK(tot)}</text>`,label);
  const leg=items.filter(i=>i.value).map(i=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><i style="width:11px;height:11px;border-radius:3px;background:${i.color};display:inline-block"></i><span style="flex:1">${esc(i.name)}</span><b>${pct(i.value/tot)}</b></div>`).join("");
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center"><div style="width:230px;max-width:100%">${svg}</div><div style="flex:1;min-width:190px;display:grid;gap:6px">${leg}</div></div>`;
}
function chartH(items,label,color){
  items=items.filter(i=>i.value>0);
  if(!items.length) return `<div class="empty">Sem dados para exibir.</div>`;
  const W=640,rowH=30,H=items.length*rowH+10,l=190,r=90,mx=Math.max(...items.map(i=>i.value)); let g="";
  items.forEach((it,i)=>{const y=i*rowH+5,w=(W-l-r)*it.value/mx, nm=it.name.length>26?it.name.slice(0,25)+"…":it.name;
    g+=`<text x="${l-8}" y="${y+18}" text-anchor="end" class="hlb">${esc(nm)}</text><rect class="bh" style="animation-delay:${i*60}ms" x="${l}" y="${y+3}" width="${w.toFixed(1)}" height="20" rx="4" fill="${color}"><title>${esc(it.name)}: ${money(it.value)}</title></rect><text x="${(l+w+6).toFixed(1)}" y="${y+18}" class="hval">${money(it.value).replace("R$","").trim()}</text>`});
  return frame(W,H,g,label);
}

function defaultMonth(){
  const c=calc(), now=new Date();
  if(DB.year===now.getFullYear()) return now.getMonth();
  const last=c.des.map((v,i)=>v>0?i:-1).filter(i=>i>=0).pop(); return last>=0?last:0;
}
function spark(arr){
  if(!arr||!arr.some(v=>v))return "";
  const W=100,H=30,mx=Math.max(...arr),mn=Math.min(0,...arr),sp=(mx-mn)||1;
  const pts=arr.map((v,i)=>[i*(W/11),H-3-((v-mn)/sp)*(H-6)]);
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="M0,${H} L${line.replace(/ /g," L")} L${W},${H}Z"/><polyline points="${line}" vector-effect="non-scaling-stroke"/></svg>`;
}
const qm=t=>`<button class="qm" tabindex="0" aria-label="Ajuda" data-tip="${esc(t)}">?</button>`;
function statusOf(c,meta){return !c.R?"idle":c.tx>=meta?"ok":c.tx>=meta/2?"warn":"bad"}
function gaugeHTML(c,meta){
  const has=c.R>0,tx=c.tx,max=Math.max(.30,meta*2,tx*1.15),W=260,cx=130,cy=124,r=96;
  const P=(f,rr)=>{const a=Math.PI*(1-f);return [cx+rr*Math.cos(a),cy-rr*Math.sin(a)]};
  const arc=f=>{const[x1,y1]=P(0,r),[x2,y2]=P(f,r);return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`};
  const v=Math.max(0,Math.min(tx,max))/max,m=Math.min(1,meta/max),st=statusOf(c,meta);
  const col={idle:"var(--gray)",ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)"}[st];
  const[a1,b1]=P(m,r-16),[a2,b2]=P(m,r+12);
  const txt={idle:"Lance receitas e despesas para ver",ok:"Meta atingida",warn:"Quase lá: está na metade do caminho ou mais",bad:"Abaixo da meta"}[st];
  return `<div class="gauge"><svg viewBox="0 0 ${W} 150" class="chart" style="max-width:300px" role="img" aria-label="Taxa de poupança comparada à meta">
   <path d="${arc(1)}" fill="none" stroke="var(--grid)" stroke-width="18" stroke-linecap="round"/>
   ${v>0?`<path class="gv" pathLength="1" d="${arc(v)}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" style="filter:drop-shadow(0 0 6px ${col})"/>`:""}
   <line x1="${a1.toFixed(1)}" y1="${b1.toFixed(1)}" x2="${a2.toFixed(1)}" y2="${b2.toFixed(1)}" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"/>
   <text x="${cx}" y="${cy-14}" text-anchor="middle" style="font-size:30px;font-weight:700;fill:${col}">${has?pct(tx):"-"}</text>
   <text x="${cx}" y="${cy+8}" text-anchor="middle" class="ax">meta: ${DB.goal}%</text></svg>
   <div class="gcap"><span class="dot ${st==="idle"?"":st}"></span>${txt}</div></div>`;
}
function insightsHTML(c){
  const L=[],meta=DB.goal/100;
  if(c.R>0){
    if(c.tx>=meta)L.push(["pie",`Você guardou <b>${pct(c.tx)}</b> das suas receitas. A sua meta é ${DB.goal}%: <b>meta atingida</b>.`]);
    else if(c.tx>=0)L.push(["pie",`Você guardou <b>${pct(c.tx)}</b> das suas receitas. A sua meta é ${DB.goal}%: faltam <b>${((meta-c.tx)*100).toFixed(1).replace(".",",")} pontos</b>.`]);
    else L.push(["warn",`No ano, você gastou <b>${money(-c.S)}</b> a mais do que recebeu. Vale rever as maiores despesas abaixo.`]);
  }
  const big=c.cat.slice().sort((a,b)=>b.total-a.total)[0];
  if(big&&big.total>0&&c.D>0)L.push(["pie",`<b>${pct(big.total/c.D)}</b> do que você gastou foi com <b>${esc(big.name)}</b>.`]);
  if(c.top.length)L.push(["tag",`A sua maior despesa do ano foi <b>${esc(c.top[0].name)}</b>: ${money(c.top[0].value)}.`]);
  const act=c.saldo.map((v,i)=>i).filter(i=>c.rec[i]>0||c.des[i]>0);
  if(act.length>=2){
    const bi=act.reduce((a,b)=>c.saldo[b]>c.saldo[a]?b:a),wi=act.reduce((a,b)=>c.saldo[b]<c.saldo[a]?b:a);
    L.push(["cal",`<b>${MFULL[bi][0].toUpperCase()+MFULL[bi].slice(1)}</b> foi o seu melhor mês (${c.saldo[bi]>=0?"sobraram":"faltaram"} ${money(Math.abs(c.saldo[bi]))}). <b>${MFULL[wi][0].toUpperCase()+MFULL[wi].slice(1)}</b> foi o mais apertado (${c.saldo[wi]>=0?"sobraram":"faltaram"} ${money(Math.abs(c.saldo[wi]))}).`]);
  }
  if(!L.length)return `<div class="hint" style="margin:0">Assim que você lançar receitas e despesas, aqui aparece um resumo em linguagem simples, como "você guardou 8% do que ganhou".</div>`;
  return `<ul class="ins">${L.map(x=>`<li><span class="ic">${svgI(x[0])}</span><span>${x[1]}</span></li>`).join("")}</ul>`;
}
function checklistHTML(){
  if(DB.chkHide)return "";
  const hasRec=Object.values(DB.years).some(y=>y.rec.some(r=>sum(r.v)>0)),hasDes=Object.values(DB.years).some(y=>y.des.some(r=>sum(r.v)>0));
  const it=[["Lançar suas receitas",hasRec,"receitas"],["Lançar suas despesas",hasDes,"despesas"],["Definir sua meta de poupança",!!DB.metaSet,"ajustes"]];
  const done=it.filter(x=>x[1]).length; if(done===it.length)return "";
  return `<div class="card check"><div class="ct"><b>Primeiros passos</b><span>${done} de ${it.length} concluídos</span><div class="prog"><i style="width:${Math.round(done/it.length*100)}%"></i></div></div>
   <div class="steps">${it.map((x,i)=>`<button class="step ${x[1]?"done":""}" data-act="go" data-tab="${x[2]}"><i>${x[1]?"✓":i+1}</i><span>${x[0]}</span></button>`).join("")}</div>
   <button class="btn ghost noprint" style="padding:8px 14px;font-size:13px" data-act="hidechk">Ocultar</button></div>`;
}

    ${kpi("Receitas no ano","Soma de tudo o que você recebeu no ano.",money(c.R),`data-v="${c.R}" data-k="money"`,"Soma de todas as entradas","#2DD4BF",spark(c.rec))}
    ${kpi("Despesas no ano","Soma de tudo o que você gastou no ano.",money(c.D),`data-v="${c.D}" data-k="money"`,"Soma de todas as saídas","#FB7C5C",spark(c.des))}
    ${kpi("Saldo no ano","Receitas menos despesas. Positivo: sobrou dinheiro. Negativo: você gastou mais do que ganhou.",`<span class="${c.S>=0?"pos":"neg"}">${money(c.S)}</span>`,`data-v="${c.S}" data-k="money"`,c.S>=0?"Resultado positivo":"Resultado negativo",saldoCol,spark(c.saldo.map(v=>Math.max(0,v))))}
    ${kpi("Taxa de poupança","Que parte das suas receitas sobrou. Exemplo: 10% significa guardar R$ 10 a cada R$ 100 que entram.",c.R?pct(c.tx):"-",c.R?`data-v="${c.tx}" data-k="pct"`:"",`<span class="dot ${st==="idle"?"":st}"></span>${stTxt}`,stCol)}
    ${kpi("Média mensal de despesas","O total gasto dividido pelos meses que têm lançamentos.",money(months?c.D/months:0),`data-v="${months?c.D/months:0}" data-k="money"`,"Considera meses com lançamentos","#A78BFA")}
    ${kpi("Maior categoria de gasto","A categoria em que você mais gastou no ano.",big&&big.total>0?esc(big.name):"-","",big&&c.D?pct(big.total/c.D)+" das despesas":"","#FBBF24")}
  </div>
  <div class="row2">
    <div class="card"><h3>Em palavras simples</h3>${insightsHTML(c)}</div>
    <div class="card"><h3>Meta de poupança ${qm("Compara a sua taxa de poupança com a meta definida em Ajustes. A marca no arco é a meta.")}</h3>${gaugeHTML(c,meta)}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Receitas × Despesas por mês ${qm("Compara, mês a mês, o que entrou e o que saiu. Barra verde maior que a coral: o mês fechou positivo.")}</h3>${chartBars([{name:"Receitas",color:"#2DD4BF",vals:c.rec},{name:"Despesas",color:"#FB7C5C",vals:c.des}],"Receitas e despesas por mês")}</div>
    <div class="card"><h3>Saldo mensal ${qm("O que sobrou (verde) ou faltou (coral) em cada mês.")}</h3>${chartBars([{name:"Saldo",vals:c.saldo}],"Saldo mensal",v=>v>=0?"#2DD4BF":"#FB7C5C")}</div>
    <div class="card"><h3>Saldo acumulado no ano ${qm("Soma do que sobrou mês a mês. Se a linha sobe, você está juntando dinheiro.")}</h3>${chartLine(c.acum,"Saldo acumulado","#22D3EE")}</div>
    <div class="card"><h3>Despesas por categoria (ano) ${qm("Mostra em que tipo de gasto vai o seu dinheiro. Cada fatia é uma categoria.")}</h3>${chartDonut(catItems,"Despesas por categoria")}</div>
    <div class="card"><h3>10 maiores despesas do ano ${qm("As 10 contas mais pesadas do ano. Bom ponto de partida para economizar.")}</h3>${chartH(c.top,"Maiores despesas","#FB7C5C")}</div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Despesas do mês, por categoria ${qm("Escolha um mês na lista para ver onde você gastou nele.")}</h3><select class="mon" id="monSel">${M.map((m,i)=>`<option value="${i}" ${i===mi?"selected":""}>${m}</option>`).join("")}</select></div><div style="height:10px"></div>${chartH(monthItems,"Despesas do mês","#2DD4BF")}</div>

     <div class="row" style="margin-bottom:10px"><button class="btn" data-act="csv">Exportar ${DB.year} para Excel (.csv)</button><button class="btn ghost" data-act="print">Imprimir relatório</button></div>
     <div class="band">EXEMPLO E LIMPEZA</div>
     <div class="row"><button class="btn ghost" data-act="demo">Carregar dados de exemplo em ${DB.year}</button><button class="btn warn" data-act="wipe">Apagar todos os dados</button></div>
     <div class="band">CONTA (LOGIN E SENHA)</div>
     <div class="hint">Usuário: <b>${esc(AUTH?AUTH.u:"")}</b></div>
     <div class="row" style="margin-bottom:8px"><input class="inp" style="width:170px" id="curPw" type="password" placeholder="Senha atual"><input class="inp" style="width:170px" id="newPw" type="password" placeholder="Nova senha"><input class="inp" style="width:170px" id="newPw2" type="password" placeholder="Repita a nova senha"></div>
     <div class="row"><button class="btn alt" data-act="chpw">Alterar senha</button><button class="btn ghost" data-act="newrec">Gerar novo código de recuperação</button><button class="btn ghost" data-act="logout">Sair</button></div>
     <div class="hint" id="acctMsg"></div>
     <div class="band">LICENÇA</div>
     <div class="hint">Ativado neste computador. Código do dispositivo: <b>${esc(LIC.fmtDevice(DEV))}</b> <button class="btn ghost" style="padding:4px 10px" data-act="copycode">Copiar</button></div>
     <div class="band">COMO USAR</div>
     <div class="hint" style="line-height:1.7">1. Em <b>Receitas</b>, lance o que você recebe mês a mês.<br>2. Em <b>Despesas</b>, lance suas contas e escolha a categoria.<br>3. Veja o <b>Painel</b> e o <b>Resumo</b>: tudo se atualiza sozinho.<br>4. Use <b>+ Novo ano</b> no topo para começar outro ano mantendo as mesmas linhas.<br>5. Passe o mouse (ou toque) no <b>?</b> ao lado de cada indicador para ver o que ele significa.</div></div>
  </div>`;
}

/* ---------- ações ---------- */
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function demoData(){
  let s=7;const rnd=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
  const jit=(b,p,z=0)=>M.map((_,i)=>i>9?null:(rnd()<z?0:Math.round(b*(1+(rnd()*2-1)*p)*100)/100));
  const flat=v=>M.map((_,i)=>i>9?null:v);
  const R=(name,type,v)=>({id:uid(),name,type,v}), D=(name,cat,v)=>({id:uid(),name,cat,v});
  return {rec:[R("Salário","Fixa",M.map((_,i)=>i>9?null:i<6?7800:8190)),R("Vale-alimentação","Fixa",flat(650)),R("Freelance","Variável",jit(1500,.5,.2)),R("Renda extra","Variável",jit(600,.6,.3)),R("Rendimentos","Extra",jit(62,.3))],
   des:[D("Aluguel","Moradia",flat(1650)),D("Condomínio","Moradia",flat(420)),D("Energia elétrica","Moradia",jit(190,.25)),D("Água","Moradia",jit(85,.2)),D("Internet","Assinaturas e Serviços",flat(119.9)),D("Celular","Assinaturas e Serviços",flat(69.9)),D("Streaming","Assinaturas e Serviços",flat(55.7)),D("Supermercado","Alimentação",jit(1100,.15)),D("Restaurantes e delivery","Alimentação",jit(380,.3)),D("Combustível","Transporte",jit(420,.15)),D("Transporte por aplicativo","Transporte",jit(130,.4)),D("Seguro do carro","Transporte",flat(310)),D("Plano de saúde","Saúde",flat(520)),D("Farmácia","Saúde",jit(95,.5)),D("Curso de inglês","Educação",flat(390)),D("Cinema e lazer","Lazer",jit(280,.35)),D("Viagens","Lazer",M.map((_,i)=>i===6?1850:i===9?980:i>9?null:0)),D("Cartão de crédito","Dívidas e Cartões",jit(1500,.3)),D("Financiamento do carro","Dívidas e Cartões",flat(890)),D("IPTU","Impostos e Taxas",flat(98)),D("IPVA","Impostos e Taxas",M.map((_,i)=>i===2?1380:i>9?null:0))]};
}
function toCSV(){
  const y=Y(), q=s=>`"${String(s??"").replace(/"/g,'""')}"`, n=v=>v?String(v).replace(".",","):"";
  const L=[["Tipo","Nome","Categoria/Tipo",...M,"TOTAL"].map(q).join(";")];
  y.rec.forEach(r=>L.push([q("Receita"),q(r.name),q(r.type),...r.v.map(n),n(sum(r.v))].join(";")));
  y.des.forEach(r=>L.push([q("Despesa"),q(r.name),q(r.cat),...r.v.map(n),n(sum(r.v))].join(";")));
  return "\ufeff"+L.join("\r\n");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act]"); if(!t) return;
  if(!LICOK){
    if(t.dataset.act==="copycode")copyText(LIC.fmtDevice(DEV));
    else if(t.dataset.act==="activate"){const k=$("#keyIn").value.trim();
      if(LIC.verify(DEV,k,PUB)){try{localStorage.setItem("cf_lic",k)}catch(_){}LICOK=true;render();toast("Programa ativado! Bom uso.")}
      else $("#keyErr").textContent="Chave inválida para este computador. Confira se copiou a chave completa."}
    return}
  if(!LOGGED){authClick(t);return}
  if(t.dataset.tab&&!t.dataset.act){UI.tab=t.dataset.tab;render();return}
  const a=t.dataset.act, y=Y();
  if(a==="go"){UI.tab=t.dataset.tab;render()}
  else if(a==="add"){const k=t.dataset.kind, item=k==="rec"?{id:uid(),name:"",type:"Fixa",v:Array(12).fill(null)}:{id:uid(),name:"",cat:DB.cats[0],v:Array(12).fill(null)};
    y[k].push(item);save();render();const r=document.querySelector(`tr[data-id="${item.id}"] .nm`);r&&r.focus()}
  else if(a==="del"){const tr=t.closest("tr"),k=UI.tab==="receitas"?"rec":"des";if(confirm("Remover esta linha?")){y[k]=y[k].filter(r=>r.id!==tr.dataset.id);save();render();toast("Linha removida")}}
  else if(a==="demo"){if(!(y.rec.length||y.des.length)||confirm(`Substituir os dados de ${DB.year} pelo exemplo?`)){Object.assign(y,demoData());save();UI.tab="painel";UI.month=null;render();toast("Exemplo carregado")}}
  else if(a==="wipe"){if(confirm("Apagar TODOS os dados de todos os anos? Isso não pode ser desfeito.")){DB=freshDB();save();UI.month=null;render();toast("Dados apagados")}}
  else if(a==="backup"){download(`backup-controle-financeiro-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DB),"application/json");toast("Backup baixado")}
  else if(a==="csv"){download(`controle-financeiro-${DB.year}.csv`,toCSV(),"text/csv;charset=utf-8");toast("Arquivo exportado")}
  else if(a==="print"){window.print()}
  else if(a==="copycode"){copyText(LIC.fmtDevice(DEV))}
  else if(a==="logout"||a==="chpw"||a==="newrec"){acctAct(a)}
  else if(a==="hidechk"){DB.chkHide=true;save();render()}
  else if(a==="tour"){UI.tab="painel";render();startTour(true)}
  else if(a==="rule20"){DB.goal=20;DB.metaSet=true;save();render();toast("Meta definida em 20%")}
  else if(a==="themeToggle"){toggleTheme();render()}
});
document.addEventListener("change",e=>{
  const el=e.target, y=Y();
  if(el.id==="yearSel"){DB.year=+el.value;UI.month=null;save();render();return}
  if(el.id==="monSel"){UI.month=+el.value;render();return}
  if(el.id==="goal"){DB.goal=Math.max(0,Math.min(100,+el.value||0));DB.metaSet=true;save();toast("Meta salva");return}
  if(el.id==="liteChk"){setLite(el.checked);toast(el.checked?"Modo leve ativado":"Modo leve desativado");return}
  if(el.id==="restore"){const f=el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!d.years||!d.cats)throw 0;if(confirm("Substituir todos os dados atuais pelo backup?")){DB=d;save();UI.month=null;render();toast("Backup restaurado")}}catch(_){alert("Arquivo de backup inválido.")}};fr.readAsText(f);return}
  if(el.dataset.cat!==undefined){const i=+el.dataset.cat, nv=el.value.trim()||DB.cats[i], old=DB.cats[i];
    if(DB.cats.some((c,j)=>j!==i&&c.toLowerCase()===nv.toLowerCase())||nv.toLowerCase()==="outros"){alert("Já existe uma categoria com esse nome.");el.value=old;return}
    Object.values(DB.years).forEach(yy=>yy.des.forEach(r=>{if(r.cat===old)r.cat=nv}));DB.cats[i]=nv;save();toast("Categoria atualizada");return}
  const tr=el.closest("tr[data-id]"); if(!tr) return;
  const k=UI.tab==="receitas"?"rec":"des", r=y[k].find(x=>x.id===tr.dataset.id); if(!r) return;
  if(el.dataset.f==="name") r.name=el.value.trim();
  else if(el.dataset.f==="sel"){if(k==="rec")r.type=el.value;else r.cat=el.value}
  else if(el.classList.contains("m")){const v=parseNum(el.value);r.v[+el.dataset.i]=v;el.value=num2(v)}
  save();updateTotals();
});
document.addEventListener("focusin",e=>{if(e.target.classList&&e.target.classList.contains("m"))e.target.select()});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!e.target.matches("td input")) return;
  e.preventDefault(); const td=e.target.closest("td"), idx=[...td.parentNode.children].indexOf(td);
  e.target.blur(); const next=td.parentNode.nextElementSibling; if(next&&next.dataset.id){const n=next.children[idx]&&next.children[idx].querySelector("input");n&&n.focus()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest&&e.target.closest(".authf")&&e.target.type!=="checkbox"){e.preventDefault();const b=document.querySelector(".authf [data-primary]");b&&b.click()}});
$("#newYear").addEventListener("click",()=>{
  if(!LICOK) return;
  const s=prompt("Qual ano deseja criar? (ex.: "+(Math.max(...Object.keys(DB.years).map(Number))+1)+")"); if(!s) return;
  const yr=parseInt(s,10); if(!(yr>=2000&&yr<=2100)){alert("Digite um ano entre 2000 e 2100.");return}
  if(DB.years[yr]){DB.year=yr}else{const copy=confirm("Copiar as linhas do ano atual (sem os valores)?\n\nOK = copiar linhas   |   Cancelar = ano em branco");
    const cur=Y();DB.years[yr]=copy?{rec:cur.rec.map(r=>({...r,id:uid(),v:Array(12).fill(null)})),des:cur.des.map(r=>({...r,id:uid(),v:Array(12).fill(null)}))}:{rec:[],des:[]};DB.year=yr}
  UI.month=null;save();render();toast("Ano "+yr+" pronto");
});

/* ---------- aparência, tour e animações (v1.3) ---------- */
let PT="dark",TS={i:0,on:false},tourTried=false;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("cf_theme",t)}catch(e){}
  const b=$("#themeBtn");if(b)b.innerHTML=svgI(t==="dark"?"sun":"moon")}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")}
function setLite(on){document.body.classList.toggle("lite",!!on);try{localStorage.setItem("cf_lite",on?"1":"0")}catch(e){}}
function setCollapsed(on){document.body.classList.toggle("collapsed",!!on);try{localStorage.setItem("cf_collapsed",on?"1":"0")}catch(e){}
  const sp=document.querySelector("#collapseBtn span");if(sp)sp.textContent=on?"Expandir menu":"Recolher menu"}
function initUI(){
  let th="dark",lite=false,col=false;
  try{th=localStorage.getItem("cf_theme")||"dark";col=localStorage.getItem("cf_collapsed")==="1";
    const lt=localStorage.getItem("cf_lite");lite=lt==="1"||(lt===null&&window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)}catch(e){}
  setTheme(th);setLite(lite);setCollapsed(col);
  $("#themeBtn").addEventListener("click",()=>{toggleTheme();if(LICOK&&LOGGED&&UI.tab==="ajustes")render()});
  $("#collapseBtn").addEventListener("click",()=>setCollapsed(!document.body.classList.contains("collapsed")));
  window.addEventListener("beforeprint",()=>{PT=document.documentElement.dataset.theme;document.documentElement.dataset.theme="light"});
  window.addEventListener("afterprint",()=>{document.documentElement.dataset.theme=PT||"dark"});
}
function animateCounts(){
  if(document.body.classList.contains("lite"))return;
  document.querySelectorAll(".cnt[data-v]").forEach(el=>{
    const v=+el.dataset.v,f=el.dataset.k==="pct"?pct:money,fin=el.innerHTML,t0=performance.now(),D=900;
    if(!isFinite(v)||!v)return;
    const tgt=el.firstElementChild&&el.firstElementChild.tagName==="SPAN"?el.firstElementChild:el;
    (function step(t){const q=Math.min(1,(t-t0)/D),e=1-Math.pow(1-q,3);if(q<1){tgt.textContent=f(v*e);requestAnimationFrame(step)}else{el.innerHTML=fin}})(t0);
  });
}
const TOUR=[
 {sel:null,t:"Bem-vindo!",p:"Vamos fazer um tour rápido de 30 segundos para você conhecer o programa. Você pode pular quando quiser."},
 {sel:"#nav button[data-tab=painel]",t:"Painel",p:"Aqui ficam os gráficos e indicadores do ano. Tudo se atualiza sozinho conforme você lança os valores."},
 {sel:"#nav button[data-tab=receitas]",t:"Receitas",p:"Lance o que você recebe: salário, renda extra, rendimentos. Um valor por mês."},
 {sel:"#nav button[data-tab=despesas]",t:"Despesas",p:"Lance suas contas e gastos e escolha a categoria de cada um. É daqui que saem os gráficos de gastos."},
 {sel:"#nav button[data-tab=resumo]",t:"Resumo",p:"Veja saldo, taxa de poupança e despesas por categoria, mês a mês. Dá para imprimir."},
 {sel:"#nav button[data-tab=ajustes]",t:"Ajustes",p:"Renomeie categorias, defina a meta de poupança, faça backup e troque a senha. Você pode rever este tour aqui."}];
function startTour(force){
  if(!force){try{if(localStorage.getItem("cf_tour")==="1")return}catch(e){}}
  TS={i:0,on:true};$("#tour").classList.add("on");drawTour();
}
function endTour(){TS.on=false;$("#tour").classList.remove("on");try{localStorage.setItem("cf_tour","1")}catch(e){}}
function drawTour(){
  const s=TOUR[TS.i],tip=$("#tour .tip"),hole=$("#tour .hole"),last=TS.i===TOUR.length-1;
  tip.innerHTML=`<h4>${s.t}</h4><p>${s.p}</p><div class="tipb"><span class="dots">${TOUR.map((_,i)=>`<i class="${i===TS.i?"on":""}"></i>`).join("")}</span><span>${TS.i>0?'<button class="btn ghost" data-tour="prev" style="padding:7px 12px">Voltar</button> ':""}<button class="btn" data-tour="next" style="padding:7px 16px">${last?"Concluir":"Próximo"}</button></span></div><div style="text-align:center;margin-top:10px"><button class="linkbtn" data-tour="skip" style="font-size:12px;color:var(--gray)">Pular tour</button></div>`;
  const vw=innerWidth,vh=innerHeight,el=s.sel?document.querySelector(s.sel):null,tw=Math.min(340,vw-24);
  if(el&&el.offsetParent!==null){
    const r=el.getBoundingClientRect(),pad=6;
    hole.style.cssText=`display:block;left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px`;
    $("#tour").classList.remove("nohole");
    let left,top;
    if(vw>900){left=r.right+22;top=Math.max(12,Math.min(r.top-10,vh-tip.offsetHeight-12))}
    else{left=Math.max(12,Math.min(r.left+r.width/2-tw/2,vw-tw-12));top=Math.max(12,r.top-tip.offsetHeight-22)}
    tip.style.left=left+"px";tip.style.top=top+"px";
  }else{
    hole.style.display="none";$("#tour").classList.add("nohole");
    tip.style.left=Math.max(12,(vw-tw)/2)+"px";tip.style.top=Math.max(12,(vh-tip.offsetHeight)/2-30)+"px";
  }
}
function afterRender(){
  if(UI.tab==="painel"){animateCounts();
    if(!tourTried){tourTried=true;setTimeout(()=>{if(!TS.on&&LICOK&&LOGGED&&UI.tab==="painel")startTour(false)},700)}}
}
$("#tour").addEventListener("click",e=>{const b=e.target.closest("[data-tour]");if(!b)return;const a=b.dataset.tour;
  if(a==="next"){if(TS.i>=TOUR.length-1)endTour();else{TS.i++;drawTour()}}else if(a==="prev"){TS.i--;drawTour()}else if(a==="skip")endTour()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&TS.on)endTour()});
window.addEventListener("resize",()=>{if(TS.on)drawTour()});

initUI();initLicense();initAuth();render();
</script>
